<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tickets - Riyadh Cultural Festival</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <!-- Header & Navigation -->
    <main>
        <h2>Book Your Tickets</h2>
        <form id="ticket-form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required><br>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required><br>
            <label for="date">Preferred Day:</label>
            <select id="date" name="date">
                <option value="dec10">Dec 10</option>
                <option value="dec11">Dec 11</option>
                <option value="dec12">Dec 12</option>
                <option value="dec13">Dec 13</option>
                <option value="dec14">Dec 14</option>
            </select><br>
            <label for="type">Ticket Type:</label>
            <select id="type" name="type">
                <option value="adult">Adult</option>
                <option value="child">Child</option>
                <option value="family">Family Pack</option>
            </select><br>
            <label for="requests">Special Requests:</label>
            <textarea id="requests" name="requests" rows="2"></textarea><br>
            <button type="submit">Submit</button>
        </form>
        <!-- Email link, as required -->
        <p>Questions? Email us at <a href="mailto:tickets@riyadhfest.com">tickets@riyadhfest.com</a></p>
        <img src="ticket-booth.jpg" alt="Ticket Booth" class="rounded-img enlarge-on-hover">
    </main>
    <footer>
        <!-- Footer as in index.html -->
    </footer>
</body>
</html>
